<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetSentinel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #020617;
      color: #e2e8f0;
      user-select: none;
    }
    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(51, 65, 85, 0.9);
      background: rgba(15, 23, 42, 0.98);
    }
    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
      background: rgba(15, 23, 42, 0.95);
      -webkit-app-region: drag;
    }
    .brand {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #22d3ee;
      font-family: ui-monospace, Consolas, monospace;
    }
    .title {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .close {
      -webkit-app-region: no-drag;
      border: 0;
      background: transparent;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }
    .close:hover { background: #1e293b; color: #e2e8f0; }
    .body {
      flex: 1;
      min-height: 0;
      padding: 16px 14px 16px 18px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.55;
      color: #cbd5e1;
      white-space: pre-wrap;
      scrollbar-width: thin;
      scrollbar-color: rgba(71, 85, 105, 0.7) transparent;
    }
    .body::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .body::-webkit-scrollbar-track {
      background: transparent;
    }
    .body::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.55);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .body::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.85);
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .body::-webkit-scrollbar-corner {
      background: transparent;
    }
    .detail {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
      color: #64748b;
      font-size: 11px;
    }
    .foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #1e293b;
      background: rgba(15, 23, 42, 0.95);
    }
    button.action {
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
    }
    button.action:hover { background: #334155; }
    button.primary {
      background: #22d3ee;
      color: #020617;
      border-color: #67e8f9;
    }
    button.primary:hover { background: #67e8f9; }
    button.danger {
      background: #f43f5e;
      color: #fff;
      border-color: #fb7185;
    }
    button.danger:hover { background: #fb7185; }
    button.warning {
      background: #f59e0b;
      color: #020617;
      border-color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div>
        <div class="brand">NetSentinel</div>
        <div class="title" id="title">Notice</div>
      </div>
      <button class="close" id="xBtn" title="Close">×</button>
    </div>
    <div class="body">
      <div id="message"></div>
      <div class="detail" id="detail" hidden></div>
    </div>
    <div class="foot" id="actions"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const params = new URLSearchParams(location.search);
    const title = params.get('title') || 'NetSentinel';
    const message = params.get('message') || '';
    const detail = params.get('detail') || '';
    const tone = params.get('tone') || 'default';
    let buttons = [];
    try { buttons = JSON.parse(params.get('buttons') || '["OK"]'); } catch (_) { buttons = ['OK']; }

    document.getElementById('title').textContent = title;
    document.getElementById('message').textContent = message;
    const detailEl = document.getElementById('detail');
    if (detail) {
      detailEl.hidden = false;
      detailEl.textContent = detail;
    }

    const actions = document.getElementById('actions');
    buttons.forEach((label, idx) => {
      const btn = document.createElement('button');
      btn.className = 'action';
      btn.textContent = label;
      if (idx === 0) {
        btn.classList.add(tone === 'danger' ? 'danger' : tone === 'warning' ? 'warning' : 'primary');
      }
      btn.addEventListener('click', () => ipcRenderer.send('app-dialog-result', idx));
      actions.appendChild(btn);
    });

    document.getElementById('xBtn').addEventListener('click', () => {
      ipcRenderer.send('app-dialog-result', buttons.length > 1 ? buttons.length - 1 : 0);
    });
  </script>
</body>
</html>
